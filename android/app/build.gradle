apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.holondo.babalon"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.holondo.babalon"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    flavorDimensions += 'content'
    productFlavors {
        offline {
            dimension 'content'
        }
        distribution {
            dimension 'content'
        }
    }
    splits {
        abi {
            enable true
            reset()
            // A local emulator check may opt into x86_64; phone/release builds keep ARM splits.
            def testAbi = providers.gradleProperty('nativeTestAbi').orNull
            if (testAbi != null) {
                if (testAbi != 'x86_64') throw new GradleException('nativeTestAbi must be x86_64')
                include testAbi
            } else {
                include 'armeabi-v7a', 'arm64-v8a'
            }
            universalApk false
        }
    }
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Samsung / Android 16 can corrupt ARCore tracking in debuggable apps.
            // Opt in only when attaching a debugger, not for physical AR acceptance.
            // https://github.com/google-ar/arcore-android-sdk/issues/1750
            debuggable = providers.gradleProperty('arDebuggable').map { it.toBoolean() }.getOrElse(false)
            // Independent of debuggable above: lets debug builds be inspected over ADB.
            buildConfigField 'boolean', 'WEBVIEW_DEBUG', 'true'
        }
        release {
            minifyEnabled true
            shrinkResources true
            buildConfigField 'boolean', 'WEBVIEW_DEBUG', 'false'
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

def abiVersionCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86_64': 3]
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI)
        if (abi != null) {
            output.versionCodeOverride = android.defaultConfig.versionCode * 100 + abiVersionCodes[abi]
            output.outputFileName = "babalon-${android.defaultConfig.versionName}-${variant.flavorName}-${abi}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "io.github.sceneview:arsceneview:2.2.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
