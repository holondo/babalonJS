<!doctype html><html><body>
<div id="app"><canvas id="scene"></canvas></div>
<button id="test" style="position:fixed;top:70px;left:8px;z-index:9999">Test anatomy</button>
<pre id="result" style="position:fixed;top:110px;left:8px;z-index:9999;background:white;color:black;max-width:95%;white-space:pre-wrap"></pre>
<script type="module">
import '/src/ui/style.css';
import {Editor} from '/src/core/editor';
import {UI} from '/src/ui/ui';
import {snapshot,restore,toZip,fromZip} from '/src/core/project';
import {normalizeParameters} from '/src/anatomy/body';
import {defaults} from '/src/anatomy/parameters';
const editor=new Editor(document.querySelector('canvas'));
const ui=new UI(editor,document.querySelector('#app'));
window.anatomyTest={editor,ui};
ui.scheduleAutosave=()=>{};ui.flushProject=async()=>{};
const check=(value,message)=>{if(!value)throw Error(message)};
const result=document.querySelector('#result');
const tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const click=text=>{const b=[...document.querySelectorAll('button')].find(b=>b.textContent.trim()===text);check(b,'Missing '+text);b.click()};
document.querySelector('#test').onclick=async()=>{try{
 result.textContent='Running';editor.resetScene();
 const e=await editor.addAnatomy();let body=e.anatomyBody;
 check(e.meshes[0].getTotalVertices()===17406,'Authored mesh');
 const skinMaterial=body.materialFor('skin');skinMaterial.metallic=.7;skinMaterial.roughness=.23;
 check(skinMaterial.getClassName()==='PBRMaterial','Native PBR material');
 const textureCanvas=document.createElement('canvas');textureCanvas.width=textureCanvas.height=8;const painter=textureCanvas.getContext('2d');painter.fillStyle='#ba8844';painter.fillRect(0,0,8,8);painter.fillStyle='#e0c6a2';painter.fillRect(0,0,4,4);
 const textureBlob=await new Promise(resolve=>textureCanvas.toBlob(resolve));await editor.setMaterialTexture(skinMaterial,'base',new File([textureBlob],'anatomy-check.png',{type:'image/png'}));
 check(e.meshes[0].getVerticesData('uv')?.length>0,'Generated texture coordinates');
 check(editor.separator.blocker(e)&&editor.optimizer.blocker(e)&&!editor.rigger.canRig(e),'Protect parametric source from destructive mesh operations');
 await Promise.all(e.meshes.map(m=>m.material.forceCompilationAsync(m)));
 editor.scene.render();await tick();
 check(e.meshes.every(m=>m.material.isReady(m)),'Shaders ready');
 const p=e.meshes[0].getVerticesData('position').slice();
 body.edit('chestWidth',40);body.commit();await body.ready();
 check(body.parameters.shoulderWidth===47,'Linked dimensions');
 check(body.materialFor('skin')===skinMaterial&&skinMaterial.metallic===.7&&skinMaterial.roughness===.23&&skinMaterial.albedoTexture,'Material edits and texture survive regeneration');
 check(e.meshes[0].getVerticesData('position').some((v,i)=>v!==p[i]),'Geometry changes');
 editor.undo();await body.ready();check(body.parameters.chestWidth===34,'Undo');
 editor.redo();await body.ready();check(body.parameters.chestWidth===40,'Redo');
 body.saveReference();await body.ready();body.edit('waistWidth',35);body.commit();await body.ready();
 const cam=editor.camera.alpha;body.compare(true);await body.ready();
 check(body.showingA&&body.parameters.waistWidth===35,'A comparison preserves B');
 check(editor.camera.alpha===cam,'Comparison camera');
 body.compare(false);await body.ready();
 body.patch({skinOpacity:.16,adiposeOpacity:.2,externalObliqueOpacity:.75,internalObliqueOpacity:1,transversusAbdominisOpacity:1,rectusAbdominisOpacity:1,otherMusclesOpacity:1,aponeurosesOpacity:.5,bonesOpacity:1,inguinalLigamentsOpacity:1});await body.ready();
 check(new Set(e.meshes.map(m=>m.metadata.anatomyLayer)).size===10,'Ten structures');
 check(e.meshes.filter(m=>m.metadata.anatomyLayer==='adipose').every(m=>m.isEnabled()),'Visible fat structure');
 await Promise.all(e.meshes.map(m=>m.material.forceCompilationAsync(m)));editor.scene.render();await tick();check(e.meshes.every(m=>m.material.isReady(m)),'Layer shaders ready');
 body.inspect(true);check(editor.helpers.size>=4,'Inspection paths');
 body.patch({skinModel:1});await body.ready();check(e.meshes.some(m=>m.getTotalVertices()>17406),'Procedural surface');
 body.patch({skinModel:0,skinOpacity:1,adiposeOpacity:0,externalObliqueOpacity:0,internalObliqueOpacity:0,transversusAbdominisOpacity:0,rectusAbdominisOpacity:0,otherMusclesOpacity:0,aponeurosesOpacity:0,bonesOpacity:0,inguinalLigamentsOpacity:0});await body.ready();
 check(e.meshes.filter(m=>m.metadata.anatomyLayer!=='skin').every(m=>!m.isEnabled()),'Hidden anatomical layers stay hidden');
 editor.duplicate(e);const copy=editor.selected;
 check(copy!==e&&copy.anatomy.parameters!==e.anatomy.parameters,'Independent duplicate');
 copy.anatomyBody.edit('height',190);copy.anatomyBody.commit();await copy.anatomyBody.ready();
 check(e.anatomy.parameters.height===175,'Duplicate parameter isolation');
 check(normalizeParameters({height:Infinity,fat:-100,chestWidth:1000}).chestWidth===55,'Import clamping');
 body.importParameters({parameters:{vOpening:1.2,eoAlpha:.6},settings:{anatomicalLinks:false}});await body.ready();check(body.parameters.inguinalOpening===1.2&&body.parameters.externalObliqueOpacity===.6,'Legacy anatomy names migrate');
 body.patch({chestWidth:40});await body.ready();
 const exchange=body.exportParameters();body.importParameters({...exchange,parameters:{...exchange.parameters,roughness:.3}});await body.ready();check(body.parameters.roughness===.3,'Original v5 JSON round trip');
 let invalid=false;try{body.importParameters(null)}catch{invalid=true}check(invalid,'Malformed JSON rejected');
 const restMesh=e.meshes.find(m=>m.metadata.anatomyLayer==='skin');const restPositions=Array.from(restMesh.getVerticesData('position'));const restUV=Array.from(restMesh.getVerticesData('uv'));
 body.editPose('rightElbowFlexion',110);body.commit();
 check(e.meshes.includes(restMesh),'Pose keeps mesh identity');
 check(restPositions.some((v,i)=>Math.abs(v-restMesh.getVerticesData('position')[i])>.001),'Pose changes real vertex positions');
 editor.undo();await body.ready();check(body.pose.rightElbowFlexion===0,'Pose undo');
 editor.redo();await body.ready();check(body.pose.rightElbowFlexion===110,'Pose redo');
 const poseExport=body.exportParameters();body.importParameters(poseExport);await body.ready();check(body.pose.rightElbowFlexion===110,'Pose JSON');
 check(restUV.every((value,i)=>value===e.meshes.find(m=>m.metadata.anatomyLayer==='skin').getVerticesData('uv')[i]),'Pose and reload preserve rest-space texture coordinates');
 body.saveReference();body.setPose({leftKneeFlexion:80});body.compare(true);await body.ready();check(body.pose.rightElbowFlexion===110&&body.pose.leftKneeFlexion===0,'A stores its pose');
 body.compare(false);await body.ready();check(body.pose.leftKneeFlexion===80,'B retains pose');
 body.setGrowth('trapeziusUpper',1.6,true);await body.ready();check(body.parameters.individualGrowth.trapeziusUpper===1.6,'Local growth');
 const sourceParameters={...body.parameters};delete sourceParameters.rectusSegmentCount;delete sourceParameters.pectoralClavicular;
 body.importParameters({parameters:{...sourceParameters,packCount:8,pecClavicular:1.4,individualGrowth:{trapeziusUpper:1.6,unknown:2}},pose:{rElbow:95}});await body.ready();
 check(body.parameters.rectusSegmentCount===8&&body.parameters.pectoralClavicular===1.4&&body.pose.rightElbowFlexion===95&&!('unknown' in body.parameters.individualGrowth),'FORMA v5 import and normalized keys');
 const snap=snapshot(editor,'Anatomy fixture');
 check(snap.json.assets.length===0,'No fabricated source assets');
 const reopened=await fromZip(await toZip(snap));const missing=await restore(editor,reopened);
 check(missing.length===0&&editor.entities.length===2,'ZIP restoration');
 check(editor.entities[0].anatomy.parameters.chestWidth===40&&editor.entities[1].anatomy.parameters.height===190,'Parameters restored');
 check(editor.entities[0].anatomy.reference&&editor.entities[0].anatomy.inspect,'Reference and inspection restored');
 check(editor.entities[0].anatomy.pose.rightElbowFlexion===95&&editor.entities[0].anatomy.parameters.individualGrowth.trapeziusUpper===1.6,'Pose and growth ZIP restore');
 check(editor.entities[0].anatomyBody.materialFor('skin').metallic===.7&&editor.entities[0].anatomyBody.materialFor('skin').albedoTexture,'PBR material and texture restored');
 const glb=await editor.exportGLB();const glbBytes=await glb.arrayBuffer();const jsonSize=new DataView(glbBytes).getUint32(12,true);const gltf=JSON.parse(new TextDecoder().decode(new Uint8Array(glbBytes,20,jsonSize)));
 check(gltf.materials.some(m=>m.pbrMetallicRoughness?.metallicFactor===.7)&&gltf.textures.length>0,'GLB exports native PBR and textures');
 editor.select(editor.entities[0]);ui.openPart('objects','anatomy');await tick();
 ui.openPart('objects','anatomy-pose');await tick();check(document.querySelector('input[aria-label="Right elbow flexion"]'),'Pose controls use existing panel');
 ui.openPart('objects','anatomy');await tick();click('Anatomical atlas');await tick();check(document.querySelector('select[aria-label="Structure"]'),'Atlas structure browser');
 click('Back to body controls');await tick();
 click('Chest');await tick();check(document.querySelector('[data-anatomy-key="chestWidth"]'),'Regional controls');
 const search=document.querySelector('input[type=search]');search.value='opacity';search.dispatchEvent(new Event('input'));
 check(document.querySelectorAll('[data-anatomy-key]').length===10,'Search all layer controls');
 search.value='';search.dispatchEvent(new Event('input'));
 ui.openPart('objects','anatomy');await tick();click('Chest');await tick();
 const held=document.querySelector('[data-anatomy-key=chestWidth] input[type=range]');
 editor.selected.anatomyBody.edit('chestWidth',38);await editor.selected.anatomyBody.ready();
 check(held.isConnected,'Slider survives background rebuild');editor.selected.anatomyBody.commit();await tick();
 editor.selected.anatomyBody.region='overview';ui.openPart('objects','anatomy');await tick();check(document.querySelector('select[aria-label="Base surface"]'),'Surface selection');
 ui.openPart('objects','anatomy-layers');await tick();check(document.querySelector('.panel-body').textContent.includes('Fat')&&document.querySelector('.panel-body').textContent.includes('Connective tissue'),'Grouped structures');
 ui.openPart('objects','material');await tick();check(document.querySelector('select[aria-label="Anatomical structure"]'),'Native material panel');
 editor.selected.anatomyBody.change(()=>{editor.selected.anatomy.studyLighting=true});ui.openPart('light','lights');await tick();check(document.querySelector('[data-anatomy-key="intensity"]'),'Study controls in Light');
 ui.openPart('objects','anatomy');await tick();
 editor.entities[0].anatomyBody.view('front');editor.entities[0].anatomyBody.frame('body');
 editor.scene.render();await tick();
 const canvas=document.querySelector('canvas');const pixels=await editor.engine.readPixels(canvas.width/2|0,canvas.height/2|0,1,1);
 check(pixels.some((v,i)=>i<3&&v>8),'Rendered color is not black');
 const png=await editor.capture(.5);check(png.type==='image/png'&&png.size>1000,'PNG capture');
 const rendered=editor.entities.length;
 editor.resetScene();editor.scene.render();check(editor.entities.length===0,'Reset cleanup');
 const pending=editor.addAnatomy().catch(()=>null);await new Promise(r=>setTimeout(r,30));editor.resetScene();check(await pending===null&&editor.entities.length===0,'Project switch cancels pending body');
 const final=await editor.addAnatomy();final.anatomyBody.view('front');final.anatomyBody.frame('body');ui.openPart('objects','anatomy');await tick();
 result.textContent=JSON.stringify({status:'PASS',restoredBodies:rendered,vertices:final.meshes[0].getTotalVertices(),checks:'PBR shaders,material persistence,ten structures,fat envelope,linked edits,undo,redo,A/B,inspection,both surfaces,duplicate,JSON,ZIP,search,body/layers/material/light,reset'},null,2);
}catch(error){result.textContent='FAIL '+(error.stack||error);console.error(error)}};
</script></body></html>
