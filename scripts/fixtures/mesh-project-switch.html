<!doctype html><!-- Run on a fresh dev-server port to isolate browser storage. Tests the real UI snapshot restore path. --><html><body><div id="app"><canvas id="scene"></canvas></div><button id="test" style="position:fixed;top:70px;left:8px;z-index:9999">Test project switch</button><pre id="result" style="position:fixed;top:110px;left:8px;z-index:9999;background:white;color:black"></pre><script type="module">
import '/src/ui/style.css';import {Editor} from '/src/core/editor';import {UI} from '/src/ui/ui';import {snapshot} from '/src/core/project';
const editor=new Editor(document.querySelector('canvas'));const ui=new UI(editor,document.querySelector('#app'));ui.scheduleAutosave=()=>{};ui.flushProject=async()=>{};const target=snapshot(editor,'Next');const result=document.querySelector('#result');
function state(){const input=editor.camera.movement.input.inputMap;const plain=x=>x.source==='pointer'&&!x.modifiers;return {mesh:editor.separator.active,drawing:document.body.classList.contains('drawing'),layer:document.querySelector('.stroke-layer').classList.contains('on'),canvasCursor:getComputedStyle(editor.engine.getRenderingCanvas()).cursor,cursor:document.querySelector('.stroke-layer g').style.display,rotate:input.find(x=>plain(x)&&x.interaction==='rotate').button,pan:input.find(x=>plain(x)&&x.interaction==='pan').button,segment:ui.segment.objects};}
document.querySelector('#test').onclick=async()=>{try{const runs=[];await ui.ensureFeature('separate');for(const mode of ['surface','lasso','brush']){ui.separateUI.start(editor.addPrimitive('sphere'));if(mode==='surface'){editor.separator.setMode('surface');editor.separator.surfaceBrush='inflate'}else{editor.separator.setMode('select');editor.separator.setTool(mode)}ui.separateUI.sync();ui.separateUI.previewBrush({x:100,y:100});const before=state();await ui.loadSnapshot(target);const after=state();runs.push({mode,before,after,pass:before.drawing&&before.rotate===2&&!after.mesh&&!after.drawing&&!after.layer&&after.cursor==='none'&&after.canvasCursor!=='crosshair'&&after.rotate===0&&after.pan===2&&after.segment==='object'});}ui.separateUI.start(editor.addPrimitive('sphere'));editor.separator.setTool('lasso');ui.separateUI.sync();editor.newScene();runs.push({mode:'new scene',after:state(),pass:!state().drawing&&state().rotate===0&&state().pan===2});result.textContent=JSON.stringify({runs,result:runs.every(x=>x.pass)?'passed':'failed'});}catch(e){result.textContent=e.stack}};
</script></body></html>
