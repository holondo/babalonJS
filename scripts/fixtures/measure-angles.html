<!doctype html><html><body><div id="app"><canvas id="scene"></canvas></div><button id="test" style="position:fixed;top:70px;left:8px;z-index:9999">Test measurements</button><pre id="result" style="position:fixed;top:110px;left:8px;z-index:9999;background:white;color:black;max-width:95%;white-space:pre-wrap"></pre><script type="module">
import '/src/ui/style.css';
import {Editor} from '/src/core/editor';
import {UI} from '/src/ui/ui';
import {Vector3} from '@babylonjs/core/Maths/math.vector.js';
import {PointerEventTypes as P} from '@babylonjs/core/Events/pointerEvents.js';
const editor = new Editor(document.querySelector('canvas'));
const ui = new UI(editor, document.querySelector('#app'));
ui.scheduleAutosave = () => {}; ui.flushProject = async () => {};
const tools = editor.tools;
const anchor = (x,y,z) => ({entity:null,local:new Vector3(x,y,z),normal:Vector3.Up()});
const check = (value, message) => { if (!value) throw Error(message); };
function event(type, p) { editor.scene.pointerX=p.x; editor.scene.pointerY=p.y; tools.handlePointer({type,event:{}}); }
function render() { editor.scene.render(); }
document.querySelector('#test').onclick = () => {try {
 tools.clear(); tools.surfaceDefault=false;
 const a=anchor(0,0,0), b=anchor(2,0,0), c=anchor(0,0,2);
 tools.addMeasurement(a,b,false); tools.setMeasureMode(true); render();
 const p=editor.toScreen(a.local);
 event(P.POINTERDOWN,p); event(P.POINTERMOVE,{x:p.x+2,y:p.y+2}); event(P.POINTERUP,p); event(P.POINTERTAP,p);
 check(tools.pending?.local.equals(a.local),'Tap must reuse exact endpoint despite jitter');
 event(P.POINTERTAP,p); check(tools.measurements.length===1,'Repeated endpoint must not create zero length');
 event(P.POINTERTAP,editor.toScreen(c.local)); render();
 check(tools.measurements.length===2,'Second measurement missing');
 check(Math.abs(tools.measurementAngles()[0].degrees-90)<0.01,'Expected 90 degrees');
 editor.undo(); check(tools.measurements.length===1,'Undo'); editor.redo(); check(tools.measurements.length===2,'Redo');
 const saved=tools.toJSON([]); tools.load(saved,[]); tools.setActive(tools.measurements[1]); render();
 check(Math.abs(tools.measurementAngles()[0].degrees-90)<0.01,'Restore angle');
 check(document.querySelector('.angle-label')?.textContent==='90.0°','Angle label');
 tools.setMeasureMode(true);
 const endpoint=editor.toScreen(tools.measurements[1].b.local);
 event(P.POINTERDOWN,endpoint); event(P.POINTERMOVE,{x:endpoint.x+30,y:endpoint.y+10}); event(P.POINTERUP,{x:endpoint.x+30,y:endpoint.y+10}); event(P.POINTERTAP,{x:endpoint.x+30,y:endpoint.y+10});
 check(!tools.pending && tools.measurements.length===2,'Drag must not place a point');
 editor.undo(); tools.setActive(tools.measurements[1]); render();
 check(Math.abs(tools.measurementAngles()[0].degrees-90)<0.01,'Undo endpoint drag');
 const straight=tools.addMeasurement(anchor(0,0,0),anchor(-2,0,0),false); tools.setActive(straight); render();
 check(tools.measurementAngles().some(a=>a.degrees===180),'180 degree angle');
 tools.setActive(null); render();
 check(tools.measurementAngles().length===3,'All three pairs must appear without selection, once each');
 check(document.querySelectorAll('.angle-label').length===3,'All angle labels visible without selection');
 tools.setActive(tools.measurements[0]); render();
 check(document.querySelectorAll('.angle-label').length===3,'Selection must not hide angles');
 check(![...document.querySelectorAll('.measure-angle-arc path')].some(p=>p.getAttribute('d').includes('NaN')),'Finite arcs');
 tools.removeMeasurement(straight); tools.setActive(tools.measurements[1]); render();
 const count = tools.measurements.length;
 tools.setMeasurementsVisible(false); render();
 check(tools.measurements.length===count && tools.measurements.every(m=>!m.line.isEnabled() && m.markers.every(p=>!p.isEnabled())), 'Hide without deletion');
 check(document.querySelectorAll('.angle-label').length===0 && [...document.querySelectorAll('.mlabel')].every(el=>getComputedStyle(el).display==='none'), 'Hide labels and angles');
 editor.undo(); render(); check(tools.measurementsVisible && tools.measurements.every(m=>m.line.isEnabled()), 'Undo visibility');
 editor.redo(); render(); check(!tools.measurementsVisible, 'Redo visibility');
 tools.load(tools.toJSON([]),[]); render(); check(!tools.measurementsVisible && tools.measurements.length===count, 'Restore hidden measurements');
 tools.setMeasurementsVisible(true); render(); check(document.querySelectorAll('.angle-label').length===1, 'Show angles again');
 tools.setMeasurementsVisible(false); tools.setMeasureMode(true); render(); check(!tools.measurementsVisible, 'Measuring must preserve visibility choices');
 tools.setMeasurementsVisible(true);
 tools.clearMeasurements();
 const sphere = editor.addPrimitive('sphere'); render();
 const bounds = editor.boundsOf(sphere), center = bounds.center, radius = bounds.size.x / 2;
 const onSphere = normal => tools.anchorOn(sphere, center.add(normal.scale(radius)), normal);
 const north = onSphere(Vector3.Up()), east = onSphere(Vector3.Right()), front = onSphere(Vector3.Forward());
 const surfaceA = tools.addMeasurement(north,east,true);
 const surfaceB = tools.addMeasurement(front,north,true); render();
 check(surfaceA.path?.length>2 && surfaceB.path?.length>2,'Real sphere surface paths');
 const surfaceAngle = tools.measurementAngles()[0]?.degrees;
 check(Math.abs(surfaceAngle-90)<5,'Surface tangents must be near 90°, not the 60° endpoint chord angle');
 check(document.querySelectorAll('.angle-label').length===1,'Surface angle label');
 surfaceA.path.unshift(surfaceA.path[0].clone()); surfaceB.path.push(surfaceB.path.at(-1).clone()); render();
 check(Math.abs(tools.measurementAngles()[0].degrees-surfaceAngle)<1e-6,'Repeated endpoint samples');
 tools.setSurface(surfaceB,false); render(); check(tools.measurementAngles().length===1,'Mixed straight and surface angle');
 tools.load(tools.toJSON(editor.entities),editor.entities); render(); check(tools.measurementAngles().length===1,'Restore surface angle');
 const distancesShown = () => [...document.querySelectorAll('.mlabel:not(.angle-label)')].filter(el=>getComputedStyle(el).display!=='none').length;
 const anglesShown = () => document.querySelectorAll('.angle-label').length;
 for (let mask=0;mask<8;mask++) {
   tools.setMeasurementDisplay('lines',!!(mask&1)); tools.setMeasurementDisplay('distances',!!(mask&2)); tools.setMeasurementDisplay('angles',!!(mask&4)); render();
   check(tools.measurements.every(m=>m.line.isEnabled()===!!(mask&1)), 'Line combination '+mask);
   check(distancesShown()===(mask&2?2:0), 'Distance combination '+mask);
   check(anglesShown()===(mask&4?1:0), 'Angle combination '+mask);
 }
 tools.setMeasurementVisible(tools.measurements[0],false); render();
 check(!tools.measurements[0].line.isEnabled() && distancesShown()===1 && anglesShown()===1, 'Individual measurement independent of angles');
 tools.setActive(tools.measurements[0]); render(); check(!tools.measurements[0].line.isEnabled(),'Selection preserves hidden state');
 tools.setAngleVisible(tools.measurementAngles()[0].key,false); render(); check(anglesShown()===0,'Individual angle hidden');
 editor.undo(); render(); check(anglesShown()===1,'Undo angle visibility');
 editor.redo(); render(); check(anglesShown()===0,'Redo angle visibility');
 tools.setMeasurementDisplay('lines',false); tools.setMeasurementsVisible(false); render();
 const visibilitySaved=tools.toJSON(editor.entities); tools.load(visibilitySaved,editor.entities); render();
 check(!tools.measurementsVisible && !tools.measurementDisplay.lines && !tools.measurements[0].visible && tools.hiddenAngles.size===1,'Persist all visibility choices');
 tools.setMeasurementsVisible(true); render();
 check(tools.measurements.every(m=>!m.line.isEnabled()) && distancesShown()===1 && anglesShown()===0,'Restore exact individual and global choices');
 tools.setMeasurementDisplay('lines',true); tools.setMeasurementDisplay('angles',false); tools.setMeasurementDisplay('angles',true); render();
 check(!tools.measurements[0].line.isEnabled() && tools.measurements[1].line.isEnabled() && anglesShown()===0,'Global switches preserve individual choices');
 tools.setMeasurementVisible(tools.measurements[0],true); tools.setAngleVisible(tools.measurementAngles()[0].key,true); render();
 tools.setAngleVisible(tools.measurementAngles()[0].key,false);
 tools.removeMeasurement(tools.measurements[0]); check(tools.hiddenAngles.size===0,'Delete cleans angle visibility');
 editor.undo(); render(); check(tools.hiddenAngles.size===1 && anglesShown()===0,'Undo deletion restores angle preference');
 const legacy=tools.toJSON(editor.entities); delete legacy.measurementDisplay; delete legacy.hiddenAngles;
 for (const m of legacy.measurements) delete m.visible;
 tools.load(legacy,editor.entities); render();
 check(tools.measurements.every(m=>m.visible && m.line.isEnabled()) && anglesShown()===1,'Older projects default to visible');
 document.querySelector('#result').textContent='PASS: endpoint reuse, surface angles, 8 visibility combinations, individual eyes, selection, hide/restore, undo/redo, saved choices. Viewport '+innerWidth+'×'+innerHeight;
} catch(error) {document.querySelector('#result').textContent='FAIL: '+error.stack;} };
</script></body></html>
