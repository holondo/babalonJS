<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><body><div id="app"><canvas id="scene"></canvas></div><button id="test" style="position:fixed;top:0;left:0;z-index:9999">Test priority anatomy</button><pre id="result" style="position:fixed;top:30px;left:0;z-index:9999;background:white;color:black;max-width:95%;white-space:pre-wrap"></pre>
<script type="module">
import '/src/ui/style.css';
import {Editor} from '/src/core/editor';import {UI} from '/src/ui/ui';
import {snapshot,restore,toZip,fromZip} from '/src/core/project';
const editor=new Editor(document.querySelector('canvas')),ui=new UI(editor,document.querySelector('#app'));
window.anatomyTest={editor,ui};ui.scheduleAutosave=()=>{};ui.flushProject=async()=>{};
const check=(v,m)=>{if(!v)throw Error(m)},tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const result=document.querySelector('#result');
document.querySelector('#test').onclick=async()=>{try{
 result.textContent='Running';editor.resetScene();const entity=await editor.addAnatomy();const body=entity.anatomyBody;editor.select(entity);body.region='abdomen';ui.openPart('objects','anatomy');await tick();let musclesTab;for(let i=0;i<100&&!(musclesTab=[...document.querySelectorAll('button[role=tab]')].find(b=>b.textContent.trim()==='Muscles'));i++)await new Promise(r=>setTimeout(r,50));check(musclesTab,'Muscles part');musclesTab.click();await tick();
 for(let i=0;i<100&&!document.querySelector('[data-individual-anatomy]');i++)await new Promise(r=>setTimeout(r,50));
 const panel=document.querySelector('[data-individual-anatomy]');check(panel,'Individual inspector');
 const link=[...panel.querySelectorAll('label')].find(n=>n.textContent.includes('Link both sides'))?.querySelector('input');check(link,'Linked side toggle');link.click();
 const width=panel.querySelector('input[aria-label="Individual width"]');check(width,'Individual width slider');width.value='1.25';width.dispatchEvent(new Event('input',{bubbles:true}));width.dispatchEvent(new Event('change',{bubbles:true}));await body.ready();
 check(body.parameters.definition.muscles['rectus_abdominis.L'].width===1.25,'UI modifies canonical left structure');check(!body.parameters.definition.muscles['rectus_abdominis.R'],'Opposite side unchanged');
 editor.undo();await body.ready();check(!body.parameters.definition,'Undo individual edit');editor.redo();await body.ready();check(body.parameters.definition.muscles['rectus_abdominis.L'].width===1.25,'Redo individual edit');
 const local=[...document.querySelectorAll('summary')].find(n=>n.textContent.trim()==='Local muscle profile');check(local,'Local muscle profile disclosure');local.click();await tick();
 const station=document.querySelector('input[aria-label="Abdominal height station 3"]');check(station,'Abdominal width station available without a GLB');
 station.value='1.2';station.dispatchEvent(new Event('input',{bubbles:true}));station.dispatchEvent(new Event('change',{bubbles:true}));await body.ready();
 check(body.parameters.definition.muscles['rectus_abdominis.L'].fittedWidthProfile[2]===1.2,'Manual abdominal width station');editor.undo();await body.ready();
 body.resetIndividual('rectus_abdominis.L');await body.ready();check(!body.parameters.definition,'Reset restores legacy definition');editor.undo();await body.ready();check(body.parameters.definition.muscles['rectus_abdominis.L'].width===1.25,'Undo structure reset');
 body.saveReference();body.editIndividual('rectus_abdominis.L','volume',1.4);body.commit();await body.ready();const metric=body.anatomyMetrics[0];check(metric.error<.02,'Actual volume tolerance');body.compare(true);await body.ready();check(body.anatomyMetrics[0].targetCm3<metric.targetCm3,'A uses independent definition');body.compare(false);await body.ready();
 body.editIndividual('rectus_abdominis.L','intersections',[{position:.65,angle:15,curvature:.05,width:1.1,depth:.7,extent:.8}]);body.commit();body.editIndividual('hip_bone.L','width',1.1);body.commit();body.editIndividual('pectoralis_major_sternocostal.L','volume',1.2);body.commit();body.patch({skinOpacity:.12,rectusAbdominisOpacity:1,otherMusclesOpacity:1,bonesOpacity:1,aponeurosesOpacity:.6,adiposeOpacity:.15});await body.ready();
 check(entity.meshes.some(m=>m.metadata?.anatomyId==='hip_bone.L'),'Bone identity');check(entity.meshes.some(m=>m.metadata?.anatomicalName==='rectus_abdominis_L_continuous'),'Continuous edited rectus');
 body.region='overview';ui.openPart('objects','anatomy');await tick();const contactToggle=[...document.querySelectorAll('[data-anatomy-connections] label')].find(n=>n.textContent.includes('Tissue contact'))?.querySelector('input');check(contactToggle,'Native tissue contact toggle');contactToggle.click();await body.ready();
 check(body.parameters.definition.interaction.contact&&body.parameters.definition.interaction.attachments,'Contact opts into connected tissues');check(body.attachmentMetrics.length>=12&&body.attachmentMetrics.every(m=>m.errorMm<.1),'Real attachment areas');check(body.contactMetrics.length>=4&&body.contactMetrics.every(m=>m.afterMm<.2),'Rest tissue clearance');
 body.setTissueInteraction({supportDetail:2});await body.ready();const previewStart=performance.now();body.editPose('rightArmAbduction',75);const posePreviewMs=performance.now()-previewStart;check(body.contactMetrics.length===0,'Contact diagnostics are deferred during slider edits');const commitStart=performance.now();body.commit();const poseCommitMs=performance.now()-commitStart;check(body.contactMetrics.length>=4,'Contact is solved on slider commit');check(body.attachmentMetrics.every(m=>m.errorMm<.1),'Pose preserves attachment areas');check(body.contactMetrics.every(m=>m.afterMm<.2),'Pose tissue clearance');
 const material=body.materialFor('rectusAbdominis');material.roughness=.33;const json=body.exportParameters();body.importParameters(json);await body.ready();check(body.materialFor('rectusAbdominis')===material,'Stable native material');
 let invalid=false;try{body.importParameters({parameters:{...body.parameters,definition:{version:99}}})}catch{invalid=true}check(invalid,'Unknown version rejected');
 body.editPose('leftHipFlexion',35);body.commit();
 const saved=await snapshot(editor);const zip=await toZip(saved);const decoded=await fromZip(zip);editor.resetScene();await restore(editor,decoded);const restored=editor.entities.find(e=>e.anatomyBody);check(restored.anatomy.parameters.definition.muscles['rectus_abdominis.L'].intersections[0].angle===15,'ZIP intersection roundtrip');check(restored.anatomy.parameters.definition.bones['hip_bone.L'].width===1.1,'ZIP bone roundtrip');check(restored.anatomyBody.pose.leftHipFlexion===35,'Pose with individual anatomy survives ZIP');check(restored.anatomy.parameters.definition.interaction.supportDetail===2&&restored.anatomy.parameters.definition.interaction.contact,'Contact and attachment detail survive ZIP');check(restored.anatomyBody.attachmentMetrics.every(m=>m.errorMm<.1),'Reopened attachment areas');
 editor.select(restored);restored.anatomyBody.region='abdomen';ui.openPart('objects','anatomy');restored.anatomyBody.view('front');restored.anatomyBody.frame('body');await tick();editor.scene.render();
 result.textContent=JSON.stringify({status:'PASS',metric,posePreviewMs,poseCommitMs,attachments:restored.anatomyBody.attachmentMetrics.length,contacts:restored.anatomyBody.contactMetrics,checks:'native UI,side isolation,undo,redo,A/B,volume,continuous rectus,pelvis,pectorals,materials,JSON,ZIP,invalid version'},null,2);
}catch(e){result.textContent='FAIL '+e.stack;console.error(e)}};
</script></body></html>
