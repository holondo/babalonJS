AntiFeatures:
  NonFreeDep:
    en-US: Native augmented reality optionally requires Google Play Services for AR on a supported device.
    pt-BR: A realidade aumentada nativa exige opcionalmente o Google Play Services para RA em um aparelho compatível.
Categories:
  - Graphics
License: GPL-3.0-or-later
AuthorName: Guilherme Holanda Sanches
WebSite: https://holondo.github.io/babalonJS/
SourceCode: https://github.com/holondo/babalonJS
IssueTracker: https://github.com/holondo/babalonJS/issues
Changelog: https://github.com/holondo/babalonJS/releases

AutoName: babalon JS

RepoType: git
Repo: https://github.com/holondo/babalonJS.git

Builds:
  - versionName: 1.0.1
    versionCode: 201
    commit: 7ed081d967e12cc2d161c5455c46037e81747ff6
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    init:
      - cd ../..
      - npm ci
      - VITE_ANDROID_DISTRIBUTION=1 npm run build
      - npx cap telemetry off
      - npx cap sync android --deployment
      - npm run android:prepare-distribution
    gradle:
      - distribution
    output: build/outputs/apk/distribution/release/babalon-1.0.1-distribution-armeabi-v7a.apk
    scandelete:
      - node_modules/

  - versionName: 1.0.1
    versionCode: 202
    commit: 7ed081d967e12cc2d161c5455c46037e81747ff6
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    init:
      - cd ../..
      - npm ci
      - VITE_ANDROID_DISTRIBUTION=1 npm run build
      - npx cap telemetry off
      - npx cap sync android --deployment
      - npm run android:prepare-distribution
    gradle:
      - distribution
    output: build/outputs/apk/distribution/release/babalon-1.0.1-distribution-arm64-v8a.apk
    scandelete:
      - node_modules/

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags ^v[\d.]+$
VercodeOperation:
  - 100 * %c + 1
  - 100 * %c + 2
CurrentVersion: 1.0.1
CurrentVersionCode: 202

MaintainerNotes: |-
  The distribution flavor intentionally retains optional native augmented reality.
  The F-Droid APK scanner currently flags 13 com/google/vr/dynamite/client
  classes supplied by com.google.ar:core through SceneView. No scanignore is
  requested; the official review should decide whether this dependency is
  acceptable.
